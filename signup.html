<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarDepot | Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .signup-card {
      width: 100%;
      max-width: 460px;
      background: var(--white);
      border-radius: 20px;
      padding: 36px;
      box-shadow: 0 30px 60px -20px rgba(20,20,20,0.25);
    }
    .signup-card h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 26px;
      text-transform: uppercase;
      margin-bottom: 8px;
      color: var(--charcoal);
    }
    .signup-card p {
      font-size: 14px;
      color: #6b6b6d;
      margin-bottom: 24px;
    }
    .signup-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .signup-actions .btn-login,
    .signup-actions .btn-signup {
      flex: 1;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .signup-actions .btn-signup {
      background: transparent;
      border: 1.5px solid #E4E4E6;
      color: var(--charcoal);
      box-shadow: none;
      padding: 13px;
      border-radius: 10px;
      font-family: 'Oswald', sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      cursor: pointer;
    }
    .signup-actions .btn-signup:hover {
      background: var(--grey-soft);
    }
  </style>
</head>
<body>
  <div class="signup-card">
    <h1>Create Account</h1>
    <p>Sign up to start your CarDepot journey.</p>

    <!-- action + method added -->
    <form action="login_register.php" method="post" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" id="username" name="username" placeholder="Choose a username" required>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="password" name="password" placeholder="Create a password" required>
        </div>
      </div>

      <div class="signup-actions">
        <!-- name="register" added -->
        <button type="submit" name="register" value="1" class="btn-login">Sign Up</button>
        <a href="index.php" class="btn-signup">Back</a>
      </div>
    </form>
  </div>

  <!-- script.js intentionally NOT included here — it was intercepting
       the submit with e.preventDefault() and saving to localStorage
       instead of sending the form to login_register.php -->
</body>
</html>
